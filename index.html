<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meal Plan App</title>

<style>
:root {
  --bg: #0b0f1a;
  --card: #1a2138;
  --accent: #60a5fa;
  --accent2: #4ade80;
  --text: #f1f5f9;
  --muted: #94a3b8;
}

body {
  margin:0;
  font-family: sans-serif;
  background: var(--bg);
  color: var(--text);
}

.app {
  max-width: 420px;
  margin: auto;
  padding: 16px;
}

/* Header */
.header {
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 12px;
}

/* Tabs */
.tabs {
  display: flex;
  overflow-x: auto;
  gap: 8px;
  margin-bottom: 16px;
}

.tab {
  padding: 8px 14px;
  border-radius: 20px;
  background: #1a2138;
  color: var(--muted);
  font-size: 13px;
  cursor: pointer;
}

.tab.active {
  background: linear-gradient(90deg, #60a5fa, #4ade80);
  color: white;
}

/* Progress */
.progress {
  height: 6px;
  background: #222;
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 16px;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #60a5fa, #4ade80);
  transition: 0.3s;
}

/* Cards */
.card {
  background: linear-gradient(145deg, #1a2138, #141a2e);
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 12px;
}

.meal-title {
  font-size: 15px;
  margin-bottom: 8px;
}

/* Checklist */
.checklist {
  list-style: none;
  padding: 0;
}

.checklist li {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
}

.checked {
  text-decoration: line-through;
  color: var(--muted);
}

/* Shopping */
.shopping {
  margin-top: 20px;
}

.shopping-list {
  list-style: none;
  padding: 0;
}

.shopping-list li {
  padding: 6px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
</style>
</head>

<body>

<div class="app">

<div class="header">Meal Plan</div>

<div class="tabs">
  <div class="tab active" onclick="switchDay('mon', this)">Mon</div>
  <div class="tab" onclick="switchDay('tue', this)">Tue</div>
</div>

<div class="progress"><div class="progress-bar" id="progressBar"></div></div>

<!-- MONDAY -->
<div id="mon" class="day">

<div class="card">
  <div class="meal-title">Lunch</div>
  <ul class="checklist">
    <li data-item="Chicken breast"><input type="checkbox" onclick="update(this)">Chicken</li>
    <li data-item="Rice"><input type="checkbox" onclick="update(this)">Rice</li>
    <li data-item="Vegetables"><input type="checkbox" onclick="update(this)">Veg</li>
  </ul>
</div>

<div class="card">
  <div class="meal-title">Dinner</div>
  <ul class="checklist">
    <li data-item="Beef"><input type="checkbox" onclick="update(this)">Beef</li>
    <li data-item="Noodles"><input type="checkbox" onclick="update(this)">Noodles</li>
  </ul>
</div>

</div>

<!-- TUESDAY -->
<div id="tue" class="day" style="display:none;">
<div class="card">
  <div class="meal-title">Lunch</div>
  <ul class="checklist">
    <li data-item="Salmon"><input type="checkbox" onclick="update(this)">Salmon</li>
    <li data-item="Sweet potato"><input type="checkbox" onclick="update(this)">Sweet potato</li>
  </ul>
</div>
</div>

<!-- SHOPPING LIST -->
<div class="shopping">
  <h3>🛒 Shopping List</h3>
  <ul id="shoppingList" class="shopping-list"></ul>
</div>

</div>

<script>
function update(box){
  const li = box.parentElement;
  li.classList.toggle('checked', box.checked);
  updateProgress();
}

function switchDay(dayId, el){
  document.querySelectorAll(".day").forEach(d => d.style.display="none");
  document.getElementById(dayId).style.display="block";

  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  el.classList.add("active");

  updateProgress();
}

function updateProgress(){
  const visible = document.querySelector(".day:not([style*='none'])");
  const all = visible.querySelectorAll("input");
  const checked = visible.querySelectorAll("input:checked");

  const percent = all.length ? (checked.length / all.length) * 100 : 0;
  document.getElementById("progressBar").style.width = percent + "%";
}

/* 🔥 AUTO SHOPPING LIST */
function generateShoppingList(){
  const items = new Set();

  document.querySelectorAll("[data-item]").forEach(el => {
    items.add(el.dataset.item);
  });

  const list = document.getElementById("shoppingList");
  list.innerHTML = "";

  items.forEach(item => {
    const li = document.createElement("li");
    li.textContent = item;
    list.appendChild(li);
  });
}

generateShoppingList();
</script>

</body>
</html>
